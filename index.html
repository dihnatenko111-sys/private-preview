<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Приватна сторінка</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; width: min(100vw, calc(100dvh * 9 / 16)); height: 100dvh; background: #000; }
  @media (max-aspect-ratio: 3/4) { #frame { width: 100vw; } }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; color: #fff; transition: opacity .4s; background: #000; }
  #loader h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.4px; text-align: center; line-height: 1.15; padding: 0 32px; }
  #track { width: 200px; height: 4px; border-radius: 2px; background: rgba(120,120,128,.36); overflow: hidden; }
  #bar { width: 0; height: 100%; border-radius: 2px; background: #FF375F; transition: width .2s; }
  #note { font-size: 13px; color: rgba(235,235,245,.6); text-align: center; padding: 0 32px; line-height: 1.4; min-height: 36px; }
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <h1 id="head">Приватна сторінка</h1>
    <div id="track"><div id="bar"></div></div>
    <div id="note"></div>
  </div>
</div></div>
<script>
  // Файли на сервері зашифровані AES-256-GCM. Ключ лежить після «#» у посиланні:
  // браузер не надсилає цю частину адреси серверу, тож без посилання вміст не прочитати.
  var head = document.getElementById("head"), note = document.getElementById("note");
  var bar = document.getElementById("bar"), track = document.getElementById("track");
  var loader = document.getElementById("loader"), canvas = document.getElementById("unity-canvas");

  function refuse(title, text) {
    head.textContent = title;
    note.textContent = text;
    track.style.display = "none";
  }

  function keyBytes(text) {
    var s = atob(text.replace(/-/g, "+").replace(/_/g, "/"));
    var out = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  // Кількість частин кожного файлу (великі файли розбиті, бо GitHub не приймає файли понад 100 МБ).
  var PARTS = [1,1,1,3];

  async function downloadOne(url, onProgress) {
    var res = await fetch(url);
    if (!res.ok) throw new Error(url + ": " + res.status);
    if (!res.body) return new Uint8Array(await res.arrayBuffer());
    var reader = res.body.getReader(), chunks = [], got = 0;
    for (;;) {
      var step = await reader.read();
      if (step.done) break;
      chunks.push(step.value);
      got += step.value.length;
      onProgress(step.value.length);
    }
    var all = new Uint8Array(got), at = 0;
    chunks.forEach(function (c) { all.set(c, at); at += c.length; });
    return all;
  }

  async function download(url, weight, base) {
    var index = +url.match(/(\d+)\.bin$/)[1], count = PARTS[index] || 1, got = 0;
    var expected = count * 40 * 1024 * 1024;
    var pieces = [];
    for (var p = 0; p < count; p++)
      pieces.push(await downloadOne(url + "." + p, function (n) {
        got += n;
        bar.style.width = Math.min(100, base + Math.min(1, got / expected) * weight) + "%";
      }));
    var size = pieces.reduce(function (s, x) { return s + x.length; }, 0), all = new Uint8Array(size), at = 0;
    pieces.forEach(function (x) { all.set(x, at); at += x.length; });
    return all;
  }

  // Формат файлу: 12 байт IV, далі шифротекст із тегом.
  async function open(url, key, type, weight, base) {
    var raw = await download(url, weight, base);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.subarray(0, 12) }, key, raw.subarray(12));
    return URL.createObjectURL(new Blob([plain], { type: type }));
  }

  function addScript(src) {
    return new Promise(function (ok, fail) {
      var s = document.createElement("script");
      s.src = src; s.onload = ok; s.onerror = fail;
      document.body.appendChild(s);
    });
  }

  (async function () {
    var secret = location.hash.slice(1);
    if (!secret) return refuse("Приватна сторінка", "Щоб відкрити її, потрібне особисте посилання.");
    if (!window.crypto || !crypto.subtle) return refuse("Не вдалося відкрити", "Цей браузер не підтримує захищене завантаження.");

    var key;
    try {
      key = await crypto.subtle.importKey("raw", keyBytes(secret), "AES-GCM", false, ["decrypt"]);
    } catch (e) {
      return refuse("Посилання неповне", "Скопіюйте його повністю разом із частиною після знака #.");
    }

    note.innerHTML = "Перше завантаження займе хвилину-дві.<br>Краще через Wi-Fi.";
    var urls;
    try {
      // Найбільший файл — дані гри; перший успішно розшифрований файл заодно перевіряє ключ.
      var loaderUrl = await open("files/0.bin", key, "text/javascript", 1, 0);
      head.textContent = "Чорна обітниця";
      document.title = "Чорна обітниця";
      urls = {
        loader: loaderUrl,
        framework: await open("files/1.bin", key, "application/octet-stream", 1, 1),
        code: await open("files/2.bin", key, "application/octet-stream", 13, 2),
        data: await open("files/3.bin", key, "application/octet-stream", 75, 15),
      };
    } catch (e) {
      if (e && e.name === "OperationError") return refuse("Посилання не підходить", "Попросіть надіслати його ще раз.");
      return refuse("Не вдалося завантажити", "Перевірте інтернет і оновіть сторінку.");
    }

    await addScript(urls.loader);
    createUnityInstance(canvas, {
      dataUrl: urls.data,
      frameworkUrl: urls.framework,
      codeUrl: urls.code,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Chorna Obitnytsia",
      productName: "Чорна обітниця",
      productVersion: "0.1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    }, function (p) {
      bar.style.width = 90 + p * 10 + "%";
    }).then(function () {
      loader.style.opacity = 0;
      setTimeout(function () { loader.remove(); }, 450);
    }).catch(function (e) {
      refuse("Гра не запустилась", "На цьому пристрої не вдалося її відкрити. " + e);
    });
  })();
</script>
</body>
</html>
